# LOCAL DEVELOPMENT ONLY — do not use for production.
# Local PostgreSQL for the NEOLIFE Traffic MVP.
# Port 5433 (not 5432) to avoid clashing with other local PostgreSQL instances.
services:
  db:
    image: postgres:16-alpine
    container_name: neolife-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neolife
      POSTGRES_PASSWORD: neolife_dev_pw
      POSTGRES_DB: neolife
    ports:
      - "5433:5432"
    volumes:
      - neolife_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neolife -d neolife"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neolife_pgdata:
